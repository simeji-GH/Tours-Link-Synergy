<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f8">
<title>アイドル組み合わせ検索</title>
<style>
:root{
  --page-bg:#fff; --header-bg:#f7f7f7; --chip:#eeeeef;
  --selected:#e8f1ff; --selected-border:#7aaeff;
  --red:#f7cccc; --yellow:#fff0bd; --blue:#dceaff;
  --text:#171717; --muted:#666; --line:#d5d5d5;
  --result-height:120px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--page-bg);color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,select{font:inherit}
button{cursor:pointer}
#header{
  flex:0 0 auto;min-height:58px;padding:8px 14px;background:var(--header-bg);
  display:flex;align-items:center;gap:14px;border-bottom:1px solid #eee;z-index:5
}
.icon-button{width:42px;height:42px;border:0;background:transparent;border-radius:10px;
  display:grid;place-items:center;color:#111;padding:6px}
.icon-button:active{background:#e5e5e5}
.icon-button svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
#headerSpacer{flex:1}
#redOnlyLabel{display:flex;align-items:center;gap:7px;font-size:15px;white-space:nowrap}
#redOnly{width:20px;height:20px;accent-color:#287ee8}
#reload:disabled{opacity:.45;cursor:wait}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#page1,#page2Results{flex:1;min-height:0;display:flex;flex-direction:column}
#optionsArea{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:16px 12px calc(var(--result-height) + 22px)}
.category{margin:8px 0 22px}
.category-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:750;
  margin:0 3px 8px}
.brand-mark{width:24px;height:24px;flex:0 0 24px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.option{
  min-height:54px;padding:9px 5px;border:1px solid transparent;border-radius:15px;
  background:var(--chip);display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:clamp(13px,3.6vw,17px);line-height:1.25;
  overflow-wrap:anywhere;position:relative;user-select:none
}
.option:active{filter:brightness(.97)}
.option.selected{background:var(--selected);border-color:var(--selected-border)}
.recommend-label{display:block;font-size:10px;line-height:1.1;color:#2769b4;font-weight:700;margin-top:3px}
.option.candidate2{background:var(--yellow)}
.option.candidate3{background:var(--red)}
.option.candidate1blue{background:var(--blue)}
.option-content{display:flex;flex-direction:column;align-items:center;justify-content:center}
#result{
  position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;
  border-top:1px solid #ccc;box-shadow:0 -2px 7px rgba(0,0,0,.06);
  padding:5px 14px calc(8px + env(safe-area-inset-bottom));
  max-height:35dvh;overflow-y:auto
}
#result:empty{display:none}
#result ul{margin:0;padding-left:20px}
#result li{margin:1px 0;font-size:16px;line-height:1.35}
#result .result-title{font-size:12px;color:var(--muted);margin:0 0 2px}
#page2Results{position:relative}
#conditionArrow{position:absolute;top:8px;left:8px;z-index:4}
#conditionSummary{padding:8px 58px 0 58px;color:#555;font-size:12px;min-height:34px}
#menuBackdrop,#overlayBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(78vw,300px);background:#fff;
  z-index:21;padding:18px 14px;box-shadow:4px 0 18px rgba(0,0,0,.18);
  transform:translateX(-105%);transition:transform .22s ease}
#drawer.open{transform:translateX(0)}
.drawer-title{font-size:18px;font-weight:750;margin:12px 8px 20px}
.drawer-link{width:100%;text-align:left;border:0;background:#f3f3f3;border-radius:10px;
  padding:14px;margin:6px 0;font-size:16px}
.drawer-link.active{background:#e6efff;color:#155bb0;font-weight:700}
.hidden{display:none!important}
#settingsOverlay{
  position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)
}
#settingsHeader{display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid #ddd;background:#f8f8f8}
#settingsHeader h2{font-size:18px;margin:0;flex:1}
#settingsBody{overflow-y:auto;min-height:0;flex:1;padding:14px 16px 24px}
.section-title{font-size:17px;font-weight:750;margin:10px 0}
.select-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.select-row select{width:100%;min-width:0;padding:11px 8px;border:1px solid #bbb;
  border-radius:9px;background:#fff}
.combo-category{margin:18px 0}
.combo-category h3{font-size:15px;margin:0 0 8px;color:#444}
.combo-list{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.combo-item{display:flex;align-items:flex-start;gap:7px;font-size:14px;line-height:1.35}
.combo-item input{width:18px;height:18px;flex:0 0 18px;margin:0;accent-color:#287ee8}
#confirmConditions{width:calc(100% - 32px);margin:10px 16px 14px;padding:13px;
  border:0;border-radius:12px;background:#287ee8;color:#fff;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:50;
  background:rgba(30,30,30,.92);color:#fff;border-radius:22px;padding:11px 17px;
  width:max-content;max-width:calc(100vw - 32px);font-size:14px;text-align:center;
  transition:opacity .22s ease,transform .22s ease;white-space:pre-wrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.loading{opacity:.6;pointer-events:none}
@media(max-width:380px){
  .grid{gap:6px}
  .option{min-height:50px;padding:7px 3px;font-size:12px;border-radius:12px}
  .category-title{font-size:20px}
  .combo-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header id="header">
  <button class="icon-button" id="menuButton" aria-label="メニューを開く">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div id="headerSpacer"></div>
  <label id="redOnlyLabel"><input type="checkbox" id="redOnly">3組のみ</label>
  <button class="icon-button" id="reload" aria-label="データとページを更新" title="更新">
    <svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3"/></svg>
  </button>
</header>

<main id="main">
  <section id="page1">
    <div id="optionsArea"></div>
  </section>
  <section id="page2Results" class="hidden">
    <button class="icon-button" id="conditionArrow" aria-label="条件を変更">
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
    </button>
    <div id="conditionSummary"></div>
    <div id="page2OptionsArea" style="flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 12px calc(var(--result-height) + 22px)"></div>
  </section>
</main>

<div id="result"></div>

<div id="menuBackdrop" class="hidden"></div>
<nav id="drawer" aria-label="ページメニュー">
  <div class="drawer-title">メニュー</div>
  <button class="drawer-link active" data-page="1">ページ1</button>
  <button class="drawer-link" data-page="2">ページ2</button>
</nav>

<div id="overlayBackdrop" class="hidden"></div>
<section id="settingsOverlay" class="hidden" aria-label="ページ2の条件設定">
  <div id="settingsHeader">
    <h2>ページ2 条件設定</h2>
    <button class="icon-button" id="closeSettings" aria-label="条件設定を閉じる">
      <svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>
    </button>
  </div>
  <div id="settingsBody">
    <div class="section-title">対象アイドル（0～2名）</div>
    <div class="select-row">
      <select id="idolSelect1" aria-label="1人目"><option value="">選択しない</option></select>
      <select id="idolSelect2" aria-label="2人目"><option value="">選択しない</option></select>
    </div>
    <div class="section-title" style="margin-top:24px">組み合わせ内容（複数選択可）</div>
    <div id="combinationList"></div>
  </div>
  <button id="confirmConditions">この条件で確認</button>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const BRAND_COLORS = {
  AS:"#ff1b24", CG:"#00a8ef", ML:"#ffc900",
  SM:"#00c878", SC:"#9861ff", GK:"#ff8700"
};

let data = [];
let options = [];
let combinations = [];
let selectedPage1 = [];
let selectedPage2 = [];
let selectedIdols = [];
let selectedCombinations = [];
let currentPage = 1;
let toastTimer = null;

/* CSVのカンマ・引用符・改行に対応 */
function parseCSV(text){
  const rows=[]; let row=[]; let field=""; let quoted=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch === '"' && text[i+1] === '"'){field+='"';i++;}
      else if(ch === '"'){quoted=false;}
      else field+=ch;
    }else{
      if(ch === '"' && field.length===0) quoted=true;
      else if(ch === ','){row.push(field.trim());field="";}
      else if(ch === '\n'){row.push(field.trim());rows.push(row);row=[];field="";}
      else if(ch !== '\r') field+=ch;
    }
  }
  if(field.length || row.length){row.push(field.trim());rows.push(row);}
  return rows.filter(r=>r.some(v=>v!==""));
}
async function fetchText(file, stamp){
  const response=await fetch(file+(stamp ? "?t="+stamp : ""),{cache:"no-store"});
  if(!response.ok) throw new Error(file+" の取得に失敗しました");
  return await response.text();
}
function parseDataCSV(text){
  return parseCSV(text).map(cols=>{
    if(cols.length<3) return null;
    const trio=cols.slice(0,3).map(v=>v.trim());
    if(trio.some(v=>!v)) return null;
    const sorted=[...trio].sort();
    return {options:sorted,key:sorted.join("\u001f"),results:cols.slice(3).map(v=>v.trim()).filter(Boolean)};
  }).filter(Boolean);
}
function parseMasterCSV(text){
  const rows=parseCSV(text);
  if(!rows.length) return [];
  const start=(rows[0][0]||"").toLowerCase()==="name" ? 1 : 0;
  return rows.slice(start).map(r=>({name:(r[0]||"").trim(),category:(r[1]||"").trim()}))
    .filter(x=>x.name);
}
function showToast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),3200);
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function brandSVG(category){
  const color=BRAND_COLORS[category]||"#888";
  /* 公式ロゴSVGの差し替え位置。現在はブランド色のSVGマークを表示 */
  return `<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="${color}"/></svg>`;
}
function setResultHeight(){
  const result=document.getElementById("result");
  const h=result && result.offsetHeight ? result.offsetHeight : 0;
  document.documentElement.style.setProperty("--result-height",Math.max(110,h+18)+"px");
}
async function loadAll(showMessage=false){
  const stamp=Date.now();
  try{
    const [dataText,optionsText,combText]=await Promise.all([
      fetchText("data.csv",stamp),fetchText("options.csv",stamp),fetchText("combinations.csv",stamp)
    ]);
    const newData=parseDataCSV(dataText);
    const newOptions=parseMasterCSV(optionsText);
    const newCombinations=parseMasterCSV(combText);
    if(!newData.length) throw new Error("data.csv に有効なデータがありません");
    if(!newOptions.length) throw new Error("options.csv に有効なデータがありません");
    if(!newCombinations.length) throw new Error("combinations.csv に有効なデータがありません");
    data=newData; options=newOptions; combinations=newCombinations;
    renderAll();
    if(showMessage){
      let message="データを更新しました";
      try{
        const updateText=await fetchText("update.txt",stamp);
        const note=updateText.trim();
        if(note) message+="\n"+note;
      }catch(_){ /* update.txt は任意 */ }
      try{ sessionStorage.setItem("pendingUpdateToast",message); }catch(_){}
    }
    return true;
  }catch(error){
    console.error(error);
    if(showMessage) showToast("更新に失敗しました");
    return false;
  }
}

/* 共通カテゴリ描画 */
function renderOptionGroups(target, page){
  target.innerHTML="";
  const grouped={};
  options.forEach(o=>(grouped[o.category] ||= []).push(o));
  Object.keys(grouped).forEach(cat=>{
    const section=document.createElement("section");
    section.className="category";
    const heading=document.createElement("h2");
    heading.className="category-title";
    heading.innerHTML=brandSVG(cat)+`<span>${escapeHTML(cat)}</span>`;
    const grid=document.createElement("div");
    grid.className="grid";
    grouped[cat].forEach(opt=>{
      const button=document.createElement("button");
      button.type="button";button.className="option";button.dataset.name=opt.name;
      button.innerHTML=`<span class="option-content"><span>${escapeHTML(opt.name)}</span></span>`;
      button.addEventListener("click",()=>toggleOption(opt.name,page));
      grid.appendChild(button);
    });
    section.append(heading,grid);target.appendChild(section);
  });
}
function renderAll(){
  renderOptionGroups(document.getElementById("optionsArea"),1);
  renderOptionGroups(document.getElementById("page2OptionsArea"),2);
  renderCombinationSettings();
  populateIdolSelects();
  updateUI(1);updateUI(2);setResultHeight();
}
function toggleOption(name,page){
  const selected=page===1?selectedPage1:selectedPage2;
  if(selected.includes(name)){
    if(page===1) selectedPage1=selected.filter(v=>v!==name);
    else selectedPage2=selected.filter(v=>v!==name);
  }else{
    if(selected.length>=3) return;
    if(page===1) selectedPage1=[...selected,name];
    else selectedPage2=[...selected,name];
  }
  updateUI(page);
}
function rowsMatchingIdols(){
  return data.filter(row=>selectedIdols.every(idol=>row.options.includes(idol)));
}
function updateUI(page){
  const isPage1=page===1;
  const selected=isPage1?selectedPage1:selectedPage2;
  const toggleRed=document.getElementById("redOnly").checked;
  const area=document.getElementById(isPage1?"optionsArea":"page2OptionsArea");
  area.querySelectorAll(".option").forEach(el=>{
    const name=el.dataset.name;
    el.className="option";
    const content=el.querySelector(".option-content");
    content.innerHTML=`<span>${escapeHTML(name)}</span>`;
    if(selected.includes(name)){
      el.classList.add("selected");
      content.innerHTML+=`<span class="recommend-label">選択中</span>`;
      return;
    }
    let matches;
    if(isPage1){
      if(selected.length===0){
        if(!toggleRed) return;
        matches=data.filter(d=>d.options.includes(name));
      }else{
        const required=[...selected,name];
        matches=data.filter(d=>required.every(v=>d.options.includes(v)));
      }
      if(!matches.length) return;
      const max=Math.max(...matches.map(m=>m.results.length));
      if(max>=3) el.classList.add("candidate3");
      else if(!toggleRed && max>=2) el.classList.add("candidate2");
    }else{
      const required=[...selectedIdols,...selected,name];
      matches=data.filter(d=>required.every(v=>d.options.includes(v)));
      if(!matches.length) return;
      const max=Math.max(...matches.map(row=>
        row.results.filter(result=>selectedCombinations.includes(result)).length
      ));
      if(max>=3) el.classList.add("candidate3");
      else if(max===2) el.classList.add("candidate2");
      else if(max===1) el.classList.add("candidate1blue");
    }
  });
  if(selected.length===3) renderResult(isPage1?selectedPage1:selectedPage2,isPage1);
  else document.getElementById("result").innerHTML="";
  setResultHeight();
}
function renderResult(selected,isPage1){
  const result=document.getElementById("result");
  const key=[...selected].sort().join("\u001f");
  const match=data.find(d=>d.key===key);
  if(!match){result.innerHTML="<div>該当なし</div>";return;}
  const list=match.results.map(value=>{
    const bold=!isPage1 && selectedCombinations.includes(value);
    return `<li>${bold?"<strong>":""}${escapeHTML(value)}${bold?"</strong>":""}</li>`;
  }).join("");
  result.innerHTML=`<div class="result-title">検索結果</div><ul>${list}</ul>`;
}

/* ページ2の条件 */
function populateIdolSelects(){
  const first=document.getElementById("idolSelect1");
  const second=document.getElementById("idolSelect2");
  const previous1=first.value,previous2=second.value;
  const makeOptions=(select,exclude,keep)=>{
    select.innerHTML='<option value="">選択しない</option>';
    options.forEach(o=>{
      if(o.name===exclude) return;
      const option=document.createElement("option");
      option.value=o.name;option.textContent=o.name;select.appendChild(option);
    });
    if(keep && [...select.options].some(o=>o.value===keep)) select.value=keep;
  };
  makeOptions(first,"",previous1);
  makeOptions(second,first.value,previous2);
}
function renderCombinationSettings(){
  const root=document.getElementById("combinationList");root.innerHTML="";
  const grouped={};
  combinations.forEach(c=>(grouped[c.category] ||= []).push(c));
  Object.keys(grouped).forEach(cat=>{
    const section=document.createElement("section");section.className="combo-category";
    const heading=document.createElement("h3");heading.textContent=cat;
    const list=document.createElement("div");list.className="combo-list";
    grouped[cat].forEach(item=>{
      const label=document.createElement("label");label.className="combo-item";
      const checkbox=document.createElement("input");checkbox.type="checkbox";
      checkbox.value=item.name;checkbox.checked=selectedCombinations.includes(item.name);
      checkbox.addEventListener("change",()=>{
        selectedCombinations=Array.from(root.querySelectorAll('input[type="checkbox"]:checked')).map(x=>x.value);
      });
      const text=document.createElement("span");text.textContent=item.name;
      label.append(checkbox,text);list.appendChild(label);
    });
    section.append(heading,list);root.appendChild(section);
  });
}
document.getElementById("idolSelect1").addEventListener("change",()=>{
  const first=document.getElementById("idolSelect1");
  const second=document.getElementById("idolSelect2");
  if(first.value && first.value===second.value) second.value="";
  populateSecondSelect();
});
function populateSecondSelect(){
  const first=document.getElementById("idolSelect1");
  const second=document.getElementById("idolSelect2");
  const keep=second.value;
  second.innerHTML='<option value="">選択しない</option>';
  options.forEach(o=>{
    if(o.name===first.value) return;
    const option=document.createElement("option");option.value=o.name;option.textContent=o.name;
    second.appendChild(option);
  });
  if(keep && keep!==first.value && [...second.options].some(o=>o.value===keep)) second.value=keep;
}
document.getElementById("idolSelect2").addEventListener("change",()=>{});
function openSettings(){
  document.getElementById("settingsOverlay").classList.remove("hidden");
  document.getElementById("overlayBackdrop").classList.remove("hidden");
}
function closeSettings(){
  document.getElementById("settingsOverlay").classList.add("hidden");
  document.getElementById("overlayBackdrop").classList.add("hidden");
}
document.getElementById("confirmConditions").addEventListener("click",()=>{
  selectedIdols=[document.getElementById("idolSelect1").value,document.getElementById("idolSelect2").value].filter(Boolean);
  if(selectedIdols.length===2 && selectedIdols[0]===selectedIdols[1]) selectedIdols.pop();
  selectedPage2=[];
  closeSettings();
  document.getElementById("conditionSummary").textContent=
    "アイドル："+(selectedIdols.join("・")||"指定なし")+" ／ 組み合わせ："+selectedCombinations.length+"件";
  updateUI(2);
});

/* ページ切り替え・メニュー */
function setPage(page){
  currentPage=page;
  document.getElementById("page1").classList.toggle("hidden",page!==1);
  document.getElementById("page2Results").classList.toggle("hidden",page!==2);
  document.getElementById("redOnlyLabel").classList.toggle("hidden",page!==1);
  document.querySelectorAll(".drawer-link").forEach(b=>b.classList.toggle("active",Number(b.dataset.page)===page));
  closeDrawer();
  if(page===2 && !selectedIdols.length && !selectedCombinations.length) openSettings();
  updateUI(page);
}
function openDrawer(){
  document.getElementById("menuBackdrop").classList.remove("hidden");
  document.getElementById("drawer").classList.add("open");
}
function closeDrawer(){
  document.getElementById("menuBackdrop").classList.add("hidden");
  document.getElementById("drawer").classList.remove("open");
}
document.getElementById("menuButton").addEventListener("click",openDrawer);
document.getElementById("menuBackdrop").addEventListener("click",closeDrawer);
document.querySelectorAll(".drawer-link").forEach(button=>button.addEventListener("click",()=>setPage(Number(button.dataset.page))));
document.getElementById("conditionArrow").addEventListener("click",openSettings);
document.getElementById("closeSettings").addEventListener("click",closeSettings);
document.getElementById("overlayBackdrop").addEventListener("click",closeSettings);
document.getElementById("redOnly").addEventListener("change",()=>updateUI(1));

/* 更新：CSV取得に失敗した場合は現在の表示を維持。成功後は最新HTMLも再読み込み */
document.getElementById("reload").addEventListener("click",async()=>{
  const button=document.getElementById("reload");
  button.disabled=true;
  document.body.classList.add("loading");
  const ok=await loadAll(true);
  document.body.classList.remove("loading");
  button.disabled=false;
  if(ok){
    /* HTML/JavaScript自体もキャッシュを避けて再取得 */
    const url=new URL(location.href);
    url.searchParams.set("refresh",String(Date.now()));
    location.replace(url.toString());
  }
});
window.addEventListener("resize",setResultHeight);
window.addEventListener("orientationchange",()=>setTimeout(setResultHeight,250));

(async function init(){
  const ok=await loadAll(false);
  if(!ok){
    document.getElementById("optionsArea").innerHTML=
      '<p style="padding:16px">データを読み込めませんでした。CSVファイルがGitHub Pages上にあるか確認してください。</p>';
    showToast("データの読み込みに失敗しました");
    return;
  }
  setPage(1);
  try{
    const pending=sessionStorage.getItem("pendingUpdateToast");
    if(pending){sessionStorage.removeItem("pendingUpdateToast");showToast(pending);}
  }catch(_){}
})();
</script>
</body>
</html>
