<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選択ツール</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ヘッダー */
#header {
  padding: 10px;
  background: #f8f8f8;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#reload {
  font-size: 20px;
  cursor: pointer;
}

/* トグル */
.switch {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 選択肢エリア */
#optionsArea {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

/* カテゴリ */
.category {
  margin-bottom: 20px;
}

.category-title {
  font-weight: bold;
  margin: 8px 0;
}

/* グリッド */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

/* チップ */
.option {
  padding: 8px;
  border-radius: 10px;
  background: #eee;
  text-align: center;
  font-size: 16px;
}

.option.selected {
  background: #007bff;
  color: #fff;
}

.option.candidate2 {
  background: gold;
}

.option.candidate3 {
  background: red;
  color: #fff;
}

/* 結果固定 */
#result {
  border-top: 1px solid #ccc;
  padding: 10px;
  background: #fff;
}
</style>
</head>

<body>

<div id="header">
  <div class="switch">
    <label>
      <input type="checkbox" id="toggle"> 赤のみ
    </label>
  </div>
  <div id="reload">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
    <path d="M21 3v5h-5"/>
    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
    <path d="M3 21v-5h5"/>
    </svg>
  </div>
</div>

<div id="optionsArea"></div>

<div id="result"></div>

<script>
let data = [];
let options = [];
let selected = [];

/* SVG（6ブランド）簡略版 */
const iconMap = {
  AS: `<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#ff0000"/></svg>`,
  CG: `<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#00aaff"/></svg>`,
  ML: `<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#ffcc00"/></svg>`,
  SM: `<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#00cc66"/></svg>`,
  SC: `<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#9966ff"/></svg>`,
  GK: `<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#ff8800"/></svg>`
};

/* 初期化 */
async function init() {
  await loadAll(true);
  render();
}

/* CSVロード */
async function loadAll(force=false) {
  const ts = force ? "?t=" + Date.now() : "";

  // data.csv
  const res1 = await fetch("data.csv" + ts);
  const text1 = await res1.text();

  data = text1.trim().split(/\r?\n/).map(line => {
    const cols = line.split(",").map(v => v.trim());
    return {
      options: cols.slice(0,3).sort(),
      results: cols.slice(3).filter(v => v)
    };
  });

  // options.csv
  const res2 = await fetch("options.csv" + ts);
  const text2 = await res2.text();

  options = text2.trim().split(/\r?\n/).slice(1).map(line => {
    const [name, category] = line.split(",").map(v => v.trim());
    return { name, category };
  });
}

/* 描画 */
function render() {
  const area = document.getElementById("optionsArea");
  area.innerHTML = "";

  const grouped = {};

  options.forEach(o => {
    if (!grouped[o.category]) grouped[o.category] = [];
    grouped[o.category].push(o);
  });

  Object.keys(grouped).forEach(cat => {
    const div = document.createElement("div");
    div.className = "category";

    div.innerHTML = `<div class="category-title">${cat}</div>`;

    const grid = document.createElement("div");
    grid.className = "grid";

    grouped[cat].forEach(opt => {
      const el = document.createElement("div");
      el.className = "option";
      el.dataset.name = opt.name;

      el.innerHTML = `${iconMap[opt.category] || ""} ${opt.name}`;

      el.onclick = () => toggle(opt.name);

      grid.appendChild(el);
    });

    div.appendChild(grid);
    area.appendChild(div);
  });

  updateUI();
}

/* 選択 */
function toggle(name) {
  if (selected.includes(name)) {
    selected = selected.filter(v => v !== name);
  } else {
    if (selected.length >= 3) return;
    selected.push(name);
  }

  updateUI();
}

/* UI更新 */
function updateUI() {
  const toggleRed = document.getElementById("toggle").checked;

  document.querySelectorAll(".option").forEach(el => {
    const name = el.dataset.name;

    el.classList.remove("selected","candidate2","candidate3");

    if (selected.includes(name)) {
      el.classList.add("selected");
      return;
    }

    // 候補判定
    let matches;

    if (selected.length === 0) {
      matches = data.filter(d => d.options.includes(name));
    } else {
      const test = [...selected, name];
      matches = data.filter(d =>
        test.every(t => d.options.includes(t))
      );
    }

    if (matches.length === 0) return;

    const max = Math.max(...matches.map(m => m.results.length));

    if (max >= 3) {
      el.classList.add("candidate3");
    } else if (!toggleRed) {
      el.classList.add("candidate2");
    }
  });

  showResult();
}

/* 結果表示 */
function showResult() {
  const resultDiv = document.getElementById("result");

  if (selected.length !== 3) {
    resultDiv.innerHTML = "";
    return;
  }

  const key = [...selected].sort().join();

  const match = data.find(d => d.options.join() === key);

  if (!match) {
    resultDiv.innerHTML = "該当なし";
    return;
  }

  resultDiv.innerHTML =
    "<ul>" + match.results.map(r => `<li>${r}</li>`).join("") + "</ul>";
}

/* トグル変更 */
document.getElementById("toggle").onchange = updateUI;

/* 更新ボタン */
document.getElementById("reload").onclick = async () => {
  await loadAll(true);
  render();
  alert("データを更新しました");
  location.reload(); // ページ自体も更新
};

init();
</script>

</body>
</html>
