<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選択ツール</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ヘッダー */
#header {
  padding: 10px;
  background: #f8f8f8;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* SVG更新ボタン */
#reload svg {
  width: 24px;
  height: 24px;
  cursor: pointer;
}

/* 選択エリア */
#optionsArea {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

/* カテゴリ */
.category {
  margin-bottom: 20px;
}

.category-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
}

/* グリッド */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

/* チップ */
.option {
  padding: 10px;
  border-radius: 10px;
  background: #eee;
  text-align: center;
}

.selected {
  background: #007bff;
  color: #fff;
}

/* 優しい色 */
.candidate2 {
  background: #fff3b0;
}

.candidate3 {
  background: #ffcccc;
}

/* 結果 */
#result {
  background: #fff;
  border-top: 1px solid #ccc;
  /*padding: 10px;*/
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
</style>
</head>

<body>

<div id="header">
  <label><input type="checkbox" id="toggle"> 赤のみ</label>

  <div id="reload">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
    <path d="M21 3v5h-5"/>
    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
    <path d="M3 21v-5h5"/>
    </svg>
  </div>
</div>

<div id="optionsArea"></div>
<div id="result"></div>

<script>
let data = [];
let prevData = [];
let options = [];
let selected = [];

/* ブランドSVG（ここは本物に差し替えOK） */
const iconMap = {
  AS:`<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#ff0000"/></svg>`,
  CG:`<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#00aaff"/></svg>`,
  ML:`<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#ffcc00"/></svg>`,
  SM:`<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#00cc66"/></svg>`,
  SC:`<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#9966ff"/></svg>`,
  GK:`<svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#ff8800"/></svg>`
};

async function loadAll(force=false) {
  try {
    const ts = force ? "?t="+Date.now() : "";

    const r1 = await fetch("data.csv"+ts);
    if (!r1.ok) throw new Error();
    const t1 = await r1.text();

    const newData = t1.trim().split(/\r?\n/).map(l=>{
      const c=l.split(",").map(v=>v.trim());
      return {
        key:c.slice(0,3).sort().join(),
        options:c.slice(0,3).sort(),
        results:c.slice(3).filter(v=>v)
      };
    });

    const r2 = await fetch("options.csv"+ts);
    if (!r2.ok) throw new Error();
    const t2 = await r2.text();

    options = t2.trim().split(/\r?\n/).slice(1).map(l=>{
      const [name,cat]=l.split(",");
      return {name:name.trim(),category:cat.trim()};
    });

    // 差分検出
    const oldKeys = new Set(data.map(d=>d.key));
    const added = newData.filter(d=>!oldKeys.has(d.key));

    prevData = data;
    data = newData;

    if (force) {
      if (added.length) {
        alert("データを更新しました\n追加："+added.map(a=>a.key).join(", "));
      } else {
        alert("データを更新しました（変更なし）");
      }
    }

  } catch(e) {
    alert("更新に失敗しました");
  }
}

function render() {
  const area=document.getElementById("optionsArea");
  area.innerHTML="";

  const grouped={};
  options.forEach(o=>{
    if(!grouped[o.category]) grouped[o.category]=[];
    grouped[o.category].push(o);
  });

  Object.keys(grouped).forEach(cat=>{
    const div=document.createElement("div");
    div.className="category";

    div.innerHTML=`<div class="category-title">${iconMap[cat]||""} ${cat}</div>`;

    const grid=document.createElement("div");
    grid.className="grid";

    grouped[cat].forEach(opt=>{
      const el=document.createElement("div");
      el.className="option";
      el.dataset.name=opt.name;
      el.textContent=opt.name;

      el.onclick=()=>toggle(opt.name);

      grid.appendChild(el);
    });

    div.appendChild(grid);
    area.appendChild(div);
  });

  updateUI();
}

function toggle(name){
  if(selected.includes(name)){
    selected=selected.filter(v=>v!==name);
  }else{
    if(selected.length>=3) return;
    selected.push(name);
  }
  updateUI();
}

function updateUI(){
  const toggleRed=document.getElementById("toggle").checked;

  document.querySelectorAll(".option").forEach(el=>{
    const name=el.dataset.name;
    el.className="option";

    if(selected.includes(name)){
      el.classList.add("selected");
      return;
    }

    let matches;

    if(selected.length===0){
      if(toggleRed){
        matches=data.filter(d=>d.options.includes(name));
      }else{
        return;
      }
    }else{
      const test=[...selected,name];
      matches=data.filter(d=>test.every(t=>d.options.includes(t)));
    }

    if(!matches.length) return;

    const max=Math.max(...matches.map(m=>m.results.length));

    if(max>=3){
      el.classList.add("candidate3");
    }else if(max>=2 && !toggleRed){
      el.classList.add("candidate2");
    }
  });

  showResult();
}

function showResult(){
  const r=document.getElementById("result");

  if(selected.length!==3){
    r.innerHTML="";
    return;
  }

  const key=[...selected].sort().join();
  const match=data.find(d=>d.key===key);

  if(!match){
    r.innerHTML="該当なし";
    return;
  }

  r.innerHTML="<ul>"+match.results.map(v=>`<li>${v}</li>`).join("")+"</ul>";
}

/* イベント */
document.getElementById("toggle").onchange=updateUI;

document.getElementById("reload").onclick=async()=>{
  await loadAll(true);
  render();
};

async function init(){
  await loadAll();
  render();
}
init();
</script>

</body>
</html>
