<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選択ツール</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ヘッダー */
#header {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 10px;
  background: #f8f8f8;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 更新ボタン */
#reload svg {
  width: 24px;
  height: 24px;
  cursor: pointer;
}

/* スクロール */
#optionsArea {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  padding-bottom: 90px;
}

/* カテゴリ */
.category {
  margin-bottom: 20px;
}

.category-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
}

/* 4列 */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

/* チップ */
.option {
  padding: 10px;
  border-radius: 10px;
  background: #eee;
  text-align: center;
  font-size: 15px; /* ←大きく */
}

/* 選択（柔らかく） */
.selected {
  background: #4da3ff;
  color: #fff;
}

/* 優しい色 */
.candidate2 {
  background: #fff3b0;
}

.candidate3 {
  background: #ffd6d6;
}

/* 結果固定 */
#result {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #fff;
  border-top: 1px solid #ccc;
  padding: 6px 10px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}

/* 余白 */
#result ul {
  margin: 2px 0 0 0;
  padding-left: 16px;
}

/* トースト */
#toast {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 16px;
  border-radius: 20px;
  opacity: 0;
  transition: 0.3s;
}
#toast.show {
  opacity: 1;
}
</style>
</head>

<body>

<div id="header">
  <label><input type="checkbox" id="toggle"> 赤のみ</label>

  <div id="reload">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
      <path d="M21 3v5h-5"/>
      <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      <path d="M3 21v-5h5"/>
    </svg>
  </div>
</div>

<div id="optionsArea"></div>
<div id="result"></div>
<div id="toast"></div>

<script>
let data = [];
let options = [];
let selected = [];

/* カテゴリ（修正済） */
const iconMap = {
  AS:"#ff0000",
  CG:"#00aaff",
  ML:"#ffcc00",
  SM:"#00cc66",
  SC:"#9966ff",
  GK:"#ff8800"
};

/* トースト */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

/* CSV */
async function loadAll(force=false){
  try{
    const ts = force ? "?t="+Date.now() : "";

    const r1 = await fetch("data.csv"+ts);
    if(!r1.ok) throw new Error();
    const t1 = await r1.text();

    data = t1.trim().split(/\r?\n/).map(l=>{
      const c=l.split(",").map(v=>v.trim());
      return {
        key:c.slice(0,3).sort().join(),
        options:c.slice(0,3).sort(),
        results:c.slice(3).filter(v=>v)
      };
    });

    const r2 = await fetch("options.csv"+ts);
    if(!r2.ok) throw new Error();
    const t2 = await r2.text();

    options = t2.trim().split(/\r?\n/).slice(1).map(l=>{
      const [name,cat]=l.split(",");
      return {name:name.trim(),category:cat.trim()};
    });

    if(force){
      try{
        const r3 = await fetch("update.txt"+ts);
        if(r3.ok){
          const msg = await r3.text();
          showToast("更新しました：" + msg);
        }else{
          showToast("データを更新しました");
        }
      }catch{
        showToast("データを更新しました");
      }
    }

  }catch{
    showToast("更新に失敗しました");
  }
}

/* 描画 */
function render(){
  const area=document.getElementById("optionsArea");
  area.innerHTML="";

  const grouped={};
  options.forEach(o=>{
    if(!grouped[o.category]) grouped[o.category]=[];
    grouped[o.category].push(o);
  });

  Object.keys(grouped).forEach(cat=>{
    const div=document.createElement("div");
    div.className="category";

    div.innerHTML=`
      <div class="category-title">
        <span style="color:${iconMap[cat]};font-size:18px;">●</span>
        ${cat}
      </div>
    `;

    const grid=document.createElement("div");
    grid.className="grid";

    grouped[cat].forEach(opt=>{
      const el=document.createElement("div");
      el.className="option";
      el.dataset.name=opt.name;
      el.textContent=opt.name;
      el.onclick=()=>toggle(opt.name);
      grid.appendChild(el);
    });

    div.appendChild(grid);
    area.appendChild(div);
  });

  updateUI();
}

/* 選択 */
function toggle(name){
  if(selected.includes(name)){
    selected=selected.filter(v=>v!==name);
  }else{
    if(selected.length>=3) return;
    selected.push(name);
  }
  updateUI();
}

/* UI */
function updateUI(){
  const toggleRed=document.getElementById("toggle").checked;

  document.querySelectorAll(".option").forEach(el=>{
    const name=el.dataset.name;
    el.className="option";

    if(selected.includes(name)){
      el.classList.add("selected");
      return;
    }

    if(selected.length===0){
      if(toggleRed){
        const m=data.filter(d=>d.options.includes(name));
        if(!m.length) return;
        const max=Math.max(...m.map(v=>v.results.length));
        if(max>=3) el.classList.add("candidate3");
      }
      return;
    }

    const test=[...selected,name];
    const m=data.filter(d=>test.every(t=>d.options.includes(t)));
    if(!m.length) return;

    const max=Math.max(...m.map(v=>v.results.length));

    if(max>=3){
      el.classList.add("candidate3");
    }else if(max>=2 && !toggleRed){
      el.classList.add("candidate2");
    }
  });

  showResult();
}

/* 結果 */
function showResult(){
  const r=document.getElementById("result");

  if(selected.length!==3){
    r.innerHTML="";
    return;
  }

  const key=[...selected].sort().join();
  const match=data.find(d=>d.key===key);

  if(!match){
    r.innerHTML="該当なし";
    return;
  }

  r.innerHTML="<ul>"+match.results.map(v=>`<li>${v}</li>`).join("")+"</ul>";
}

/* イベント */
document.getElementById("toggle").onchange=updateUI;
document.getElementById("reload").onclick=async()=>{await loadAll(true);render();};

init();
async function init(){
  await loadAll();
  render();
}
</script>

</body>
</html>
